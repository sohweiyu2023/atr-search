# Rebuilds the Awakening to Reality search index from the blog feed and
# publishes it on GitHub Pages. Runs every 3 hours by itself; nothing to do.
# Stable dependencies verified 2026-10-25; action commits pinned for reproducibility.
name: Build AtR search index

on:
  schedule:
    - cron: '23 */3 * * *'      # every 3 hours (UTC), at :23 past
  workflow_dispatch: {}          # "Run workflow" button for an immediate rebuild

permissions:
  contents: write                # the keepalive commit (below)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: python_setup
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - id: node_setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - name: Install locked index dependencies
        id: dependencies
        run: npm ci --ignore-scripts
      - name: Test the offline index build
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Build the index from the blog feed
        id: index
        run: python build_index.py --out public
      - id: pages_config
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      # GitHub pauses scheduled jobs in repositories with no commits for 60
      # days. A tiny commit every ~45 days keeps the schedule running.
      - name: Keep the schedule alive
        id: keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u > last-keepalive.txt
            git add last-keepalive.txt
            git commit -m "Keep the search schedule active"
            git push
          fi
      - name: Summarize build diagnostics
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          ATR_STEP_RESULTS: >-
            {"checkout":{"outcome":"${{ steps.checkout.outcome }}"},
            "python_setup":{"outcome":"${{ steps.python_setup.outcome }}"},
            "node_setup":{"outcome":"${{ steps.node_setup.outcome }}"},
            "dependencies":{"outcome":"${{ steps.dependencies.outcome }}"},
            "tests":{"outcome":"${{ steps.tests.outcome }}"},
            "index":{"outcome":"${{ steps.index.outcome }}"},
            "pages_config":{"outcome":"${{ steps.pages_config.outcome }}"},
            "artifact":{"outcome":"${{ steps.artifact.outcome }}"},
            "keepalive":{"outcome":"${{ steps.keepalive.outcome }}"}}
        run: python workflow_summary.py

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Summarize deployment outcome
        if: ${{ always() }}
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        shell: bash
        run: |
          case "$DEPLOYMENT_OUTCOME" in
            success|failure|cancelled|skipped) outcome="$DEPLOYMENT_OUTCOME" ;;
            *) outcome="unavailable" ;;
          esac
          if ! printf '## AtR deployment\n\nOutcome: %s\n' "$outcome" | tee -a "$GITHUB_STEP_SUMMARY"; then
            printf '::warning::AtR deployment summary could not be written; use the deployment step result.\n' || true
          fi
